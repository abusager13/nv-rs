[package]
name = "wgpu-ffx"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Local wgpu 30 adaptation of the FSR 3.1.4 upscaler"

[dependencies]
bitflags = "2"
bytemuck = { version = "1.14", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck"] }
thiserror = "2"
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["spirv", "wgsl"] }
wgpu-ffx-shaders-spv = "0.1.0"
