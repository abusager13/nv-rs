[package]
name = "nv-viewer"
version = "0.1.0"
description = "Walk around a Fallout: New Vegas cell in real time (Bevy)"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so the rest of the project still builds without
# downloading Bevy.
[workspace]

[dependencies]
# Pinned: Bevy's API changes between releases.
bevy = "0.16"
# Bevy's own wgpu (the same version, no features of its own): the window's
# surface asked which present modes it takes (`present`).
wgpu = { version = "24", default-features = false }
cellview = { path = "../crates/cellview" }
physics = { path = "../crates/physics" }
world = { path = "../crates/world" }
esm = { path = "../crates/esm" }
nif = { path = "../crates/nif" }
preview = { path = "../crates/preview" }
assets = { path = "../crates/assets" }
ui = { path = "../crates/ui" }
bink = { path = "../crates/bink" }
speedtree = { path = "../crates/speedtree" }
# Decodes the game's .ogg sounds (already in the build through Bevy's audio,
# whose own .ogg playback crashed the viewer in Dead Money's Villa).
lewton = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "std",
    "GCController",
    "GCExtendedGamepad",
    "GCPhysicalInputProfile",
    "GCControllerElement",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerAxisInput",
] }

[dev-dependencies]
testdata = { path = "../crates/testdata" }

# Bevy is slow unoptimized; optimize dependencies even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
